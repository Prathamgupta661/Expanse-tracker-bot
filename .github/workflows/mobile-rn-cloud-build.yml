name: Mobile RN Cloud Build

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-capture-rn/**"
      - ".github/workflows/mobile-rn-cloud-build.yml"

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-capture-rn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-capture-rn/package-lock.json

      - name: Install deps
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: npm ci --legacy-peer-deps

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build (Android APK)
        run: eas build --platform android --profile preview --non-interactive --wait
